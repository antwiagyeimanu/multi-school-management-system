{% extends 'accounts/dashboard_base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'accounts/css/dashboard.css' %}">

<h2>Manage Users</h2>

<table class="table">
  <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <a href="{% url 'edit-user' user.id %}" class="btn btn-primary">Edit</a>
        <a href="{% url 'delete-user' user.id %}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="4" style="text-align:center;">No users found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
