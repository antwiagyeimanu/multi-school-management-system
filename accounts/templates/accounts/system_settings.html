{% extends 'accounts/dashboard_base.html' %}

{% block content %}
<h2>System Settings</h2>

<form method="post">
  {% csrf_token %}
  <label for="site_name">Site Name:</label>
  <input type="text" id="site_name" name="site_name" value="My School Management System"><br><br>

  <label for="max_students">Max Students per Class:</label>
  <input type="number" id="max_students" name="max_students" value="30"><br><br>

  <input type="submit" value="Save Settings">
</form>
{% endblock %}
