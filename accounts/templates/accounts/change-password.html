<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .container {
            width: 400px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #007bff;
            color: white;
            font-weight:bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Change Password</h2>
        <div style="background:#eef2ff; padding:12px; border-radius:8px; margin:15px 0; font-size:14px;">
    <strong>Password Rules:</strong>
    <ul style="margin:8px 0; padding-left:18px;">
        <li>At least 8 characters</li>
        <li>Must include letters</li>
        <li>Must include numbers</li>
        <li>No common passwords (like password, 123456)</li>
        <li>Must not be your old password</li>
    </ul>
</div>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

<form method="POST" action="{% url 'accounts:change-password' %}">
            {% csrf_token %}

           <div style="position: relative;">
<input type="password" id="password1" name="password1" placeholder="New Password" required onkeyup="checkPasswordMatch(); checkPasswordStrength()">
<div id="strengthMessage" style="font-size: 14px; margin-top: 5px;"></div>
    <span onclick="togglePassword('password1')" 
          style="position: absolute; right: 10px; top: 10px; cursor: pointer;">
        👁️
    </span>
</div>

<div style="position: relative;">
<input type="password" id="password2" name="password2" placeholder="Confirm Password" required onkeyup="checkPasswordMatch()">
    <p id="matchMessage" style="font-size: 14px;"></p>
    <span onclick="togglePassword('password2')" 
          style="position: absolute; right: 10px; top: 10px; cursor: pointer;">
        👁️
    </span>
</div>

            <button type="submit">Change Password</button>
        </form>

    </div>
</div>

</body>
</html>
<script>
function togglePassword(fieldId) {
    var field = document.getElementById(fieldId);

    if (field.type === "password") {
        field.type = "text";
    } else {
        field.type = "password";
    }
}

</script>
<script>
function checkPasswordMatch() {
    var p1 = document.getElementById("password1").value;
    var p2 = document.getElementById("password2").value;
    var message = document.getElementById("matchMessage");

    if (p2.length === 0) {
        message.textContent = "";
        return;
    }

    if (p1 === p2) {
        message.textContent = "Passwords match ✅";
        message.style.color = "green";
    } else {
        message.textContent = "Passwords do not match ❌";
        message.style.color = "red";
    }
}
</script>
<script>
function checkPasswordStrength() {
    var password = document.getElementById("password1").value;
    var confirmPassword = document.getElementById("password2").value;
    var message = document.getElementById("strengthMessage");
    if (password.length === 0) {
        message.textContent = "";
        return;
    }
    let errors = [];
    if (password.length < 8)
        errors.push("8+ characters");
    if (!/[A-Z]/.test(password))
        errors.push("uppercase");
    if (!/[a-z]/.test(password))
        errors.push("lowercase");
    if (!/[0-9]/.test(password))
        errors.push("number");
    if (!/[!@#$%^&*(),.?\":{}|<>]/.test(password))
        errors.push("symbol");
    // WEAK PASSWORD
    if (errors.length > 0) {
        message.textContent =
            "Weak: " + errors.join(", ");
        message.style.color = "red";
        return;
    }
    // PASSWORDS DON'T MATCH
    if (confirmPassword.length > 0 && password !== confirmPassword) {
        message.textContent = "Passwords do not match ❌";
        message.style.color = "red";
        return;
    }
    // STRONG PASSWORD
    if (confirmPassword.length > 0 && password === confirmPassword) {
        message.textContent = "Strong Password ✅";
        message.style.color = "green";
    } else {
        message.textContent = "Good password — confirm it";
        message.style.color = "orange";
    }
}
</script>
