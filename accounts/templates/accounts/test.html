<!DOCTYPE html>
<html>
<head>
<style>
  body{ margin:0; padding:20px; background:#f3f4f6; font-family:sans-serif; }
  .report-card{ background:#fff; padding:20px; max-width:800px; margin:auto; position:relative; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  th,td{ border:1px solid #000; padding:6px; }
  .next-term{ text-align:center; margin-top:15px; font-weight:bold; }

  @media print{
    body{ background:#fff; padding:0; margin:0; }
    .report-card{ box-shadow:none; }
    @page{ size:A4; margin:10mm; }
    /* THIS LINE KILLS BLANK PAGE 2 */
    html, body{ height:100%; overflow:hidden; }
    body{ height:auto; }
  }
</style>
</head>
<body>
<div class="report-card">
  <h2 style="text-align:center">SCHOOL REPORT</h2>
  <table>
    <tr><th>Subject</th><th>Marks</th></tr>
    <tr><td>Maths</td><td>80</td></tr>
    <tr><td>English</td><td>75</td></tr>
    <tr><td>Science</td><td>85</td></tr>
  </table>
  <div class="next-term">Next Term Begins: Tuesday, 29th September 2026</div>
</div>
</body>
</html>
