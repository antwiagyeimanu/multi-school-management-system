{% extends "accounts/dashboard_base.html" %}

{% block title %}My Classes{% endblock %}

{% block content %}
<h2>My Classes</h2>

{% if classes %}
<table>
    <tr>
        <th>Class Name</th>
        <th>Subject</th>
    </tr>
    {% for class in classes %}
    <tr>
        <td>{{ class.name }}</td>
        <td>{{ class.subject }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No classes assigned yet.</p>
{% endif %}
{% endblock %}
