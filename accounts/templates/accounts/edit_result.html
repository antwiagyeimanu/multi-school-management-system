{% extends "accounts/dashboard_base.html" %}

{% block content %}

<div style="display:flex;justify-content:center;margin-top:40px;">

    <div style="
        width:520px;
        background:white;
        padding:35px;
        border-radius:14px;
        box-shadow:0 6px 18px rgba(0,0,0,0.18);
        font-size:18px;
    ">

        <h2 style="
            text-align:center;
            margin-bottom:25px;
            font-size:26px;
        ">
            Edit Result
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div style="margin-bottom:18px;">
                <label style="font-size:18px;"><strong>Student</strong></label>
                <div style="font-size:18px; padding:8px; background:#f5f5f5; border-radius:6px;">
                    {{ result.student.get_full_name }}
                </div>
            </div>

            <div style="margin-bottom:18px;">
                <label style="text-align: center; font-size:18px;"><strong>Subject</strong></label>
                <div style="font-size:18px; padding:8px; background:#f5f5f5; border-radius:6px;">
                    {{ result.subject.name }}
                </div>
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-size:18px;"><strong>Class Score</strong></label>
               <div style="font-size:18px;">
                {{ result.class_score }}
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-size:18px;"><strong>Exam Score</strong></label>
                <div style="font-size:18px;">{{ form.exam_score }}</div>
                {{ form.exam_score.errors }}
            </div>

            <button type="submit" style="
                width:100%;
                padding:12px;
                background:#3498db;
                color:white;
                border:none;
                border-radius:8px;
                font-size:18px;
                cursor:pointer;
            ">
                Save Changes
            </button>

        </form>

    </div>

</div>


{% endblock %}
