{% extends "accounts/dashboard_base.html" %}

{% block content %}

<style>

.edit-attendance-wrapper{
    padding:20px;
}

.edit-card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    max-width:700px;
    margin:auto;
}


.edit-header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:25px;
}


.edit-header h3{
    margin:0;
    font-weight:800;
}


.info-box{
    background:#f8fafc;
    border-radius:15px;
    padding:20px;
    margin-bottom:25px;
}


.info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #e5e7eb;
}


.info-row:last-child{
    border-bottom:none;
}


.info-label{
    font-weight:700;
    color:#64748b;
}


.info-value{
    font-weight:800;
    color:#1e293b;
}


.form-label{
    font-weight:700;
}


.btn-save{
    border-radius:30px;
    padding:10px 30px;
    font-weight:700;
}


</style>


<div class="edit-attendance-wrapper">


<div class="edit-card">


<div class="edit-header">

<h3>
<i class="bi bi-pencil-square"></i>
Edit Teacher Attendance
</h3>

</div>



<div class="info-box">


<div class="info-row">

<span class="info-label">
Teacher
</span>

<span class="info-value">
{{ attendance.teacher.get_full_name }}
</span>

</div>



<div class="info-row">

<span class="info-label">
Staff ID
</span>

<span class="info-value">
{{ attendance.teacher.staff_id }}
</span>

</div>



<div class="info-row">

<span class="info-label">
Attendance Date
</span>

<span class="info-value">

{{ attendance.date|date:"l, d M Y" }}

</span>

</div>



</div>




<form method="POST">

{% csrf_token %}



<div class="mb-3">

<label class="form-label">
Status
</label>

<select name="status" class="form-select">


<option value="P" {% if attendance.status == "P" %}selected{% endif %}>
Present
</option>


<option value="L" {% if attendance.status == "L" %}selected{% endif %}>
Late
</option>


<option value="A" {% if attendance.status == "A" %}selected{% endif %}>
Absent
</option>


<option value="LV" {% if attendance.status == "LV" %}selected{% endif %}>
Leave
</option>


<option value="S" {% if attendance.status == "S" %}selected{% endif %}>
Sick
</option>
<option value="E" {% if attendance.status == "E" %}selected{% endif %}>
Excused
</option>


</select>

</div>




<div id="timeFields">

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Time In
        </label>

        <input
        type="time"
        name="time_in"
        class="form-control"
        value="{% if attendance.time_in %}{{ attendance.time_in|time:'H:i' }}{% endif %}"
        >

    </div>


    <div class="col-md-6 mb-3">

        <label class="form-label">
            Time Out
        </label>

        <input
        type="time"
        name="time_out"
        class="form-control"
        value="{% if attendance.time_out %}{{ attendance.time_out|time:'H:i' }}{% endif %}"
        >

    </div>

</div>

</div>




<div class="mb-3">

<label class="form-label">
Note
</label>


<textarea
name="note"
class="form-control"
rows="4"
>{{ attendance.note }}</textarea>


</div>




<div class="d-flex gap-2">


<button class="btn btn-primary btn-save">

<i class="bi bi-check-circle"></i>
Save Changes

</button>


<a href="{% url 'accounts:teacher_attendance_report' %}"
class="btn btn-outline-secondary btn-save">

Cancel

</a>


</div>



</form>


</div>


</div>

<script>

const statusSelect = document.querySelector('select[name="status"]');
const timeFields = document.getElementById('timeFields');


function toggleTimeFields(){

    if(
        statusSelect.value === "P" ||
        statusSelect.value === "L"
    ){
        timeFields.style.display = "block";
    }
    else{
        timeFields.style.display = "none";
    }

}


toggleTimeFields();


statusSelect.addEventListener(
    "change",
    toggleTimeFields
);


</script>
{% endblock %}
