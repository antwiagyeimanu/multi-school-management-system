{% extends 'accounts/dashboard_base.html' %}

{% block content %}

<style>

.class-page {
    min-height: calc(100vh - 120px);
    background: #f5f7fb;
    padding: 35px 20px;
}


.class-card {

    max-width: 520px;
    margin: auto;
    background: white;
    border-radius: 22px;
    padding: 35px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

    transition: .3s ease;
}


.class-card:hover {
    transform: translateY(-4px);
    box-shadow:
    0 15px 40px rgba(0,0,0,0.12);
}



/* Header */

.class-header {

    text-align:center;
    margin-bottom:30px;

}


.class-header .icon {

    width:70px;
    height:70px;
    background:#e3f2fd;
    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:35px;

    margin:auto;
    margin-bottom:15px;

}


.class-header h2 {

    font-size:28px;
    font-weight:700;
    color:#041729;
    margin-bottom:5px;

}


.class-header p {

    color:#6c757d;
    font-size:14px;

}



/* Form */

form p {

    margin-bottom:20px;

}


form label {

    font-weight:600;
    color:#34495e;
    font-size:14px;

}



input,
select {

    width:100%;
    padding:12px 14px;

    border-radius:12px;

    border:1px solid #ddd;

    margin-top:6px;

    font-size:15px;

    transition:.3s;

}



input:focus,
select:focus {

    border-color:#4e73df;

    box-shadow:
    0 0 0 4px rgba(78,115,223,.15);

    outline:none;

}



/* Button */

.save-class-btn {

    width:100%;

    padding:13px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(135deg,#041729,#0b3b66);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}


.save-class-btn:hover {

    transform:translateY(-3px);

    box-shadow:
    0 10px 25px rgba(4,23,41,.25);

}



</style>



<div class="class-page">


<div class="class-card">


<div class="class-header">

<div class="icon">
🏫
</div>


<h2>
Add New Class
</h2>


<p>
Create a class for {{ school.name }}
</p>


</div>



<form method="POST">

{% csrf_token %}


{{ form.as_p }}



<button type="submit" class="save-class-btn">

➕ Add Class

</button>


</form>


</div>


</div>



{% endblock %}
